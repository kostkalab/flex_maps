    sha256: fefd46f397add863bb825d838358cdef4d75188b3810682e0f28c6fb7d49af59
  ncbi_gene_info:
    retrieved: "2026-02-24"
    url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/gene_info.gz
    local_file: data/ncbi/gene_info.20260224.gz
    sha256: 46a8dc8989ac893a302dc66d496be0d04eb185e693cb5ddf6c289ba02463a43b
  ncbi_gene2ensembl:
    retrieved: "2026-02-24"
    url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/gene2ensembl.gz
